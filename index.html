<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Offline-App für Wartungsprotokolle mit Vorlagen und PDF-Bericht">
  <meta name="theme-color" content="#F2F5F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wartung">
  <title>Wartungsprotokolle</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192-v2.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/basis.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/komponenten.css">
  <link rel="stylesheet" href="./css/screens.css">
  <link rel="stylesheet" href="./css/bericht.css">
  <link rel="stylesheet" href="./css/druck.css" media="print">

  <script>
    // Thema vor dem ersten Rendern setzen (kein Aufblitzen)
    try { const t = localStorage.getItem('thema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <aside class="seitenleiste">
      <div class="marke">
        <span class="marke-zeichen" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span>
        <span class="marke-text"><strong>Wartung</strong><span>Protokolle</span></span>
      </div>
      <nav id="seiten-nav" class="seiten-nav" aria-label="Hauptnavigation"></nav>
      <button class="btn btn-ghost thema-knopf" id="thema" type="button"></button>
    </aside>

    <div class="hauptbereich">
      <header class="kopf" id="kopf"></header>
      <main id="inhalt" class="inhalt"></main>
    </div>

    <nav id="unten-nav" class="unten-nav" aria-label="Hauptnavigation"></nav>
  </div>

  <div class="drop-hinweis" aria-hidden="true"><div>Dateien loslassen zum Importieren</div></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
